[package]
name = "echoes_world_simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A procedural, turn-based living world strategy game built with Rust and Bevy"
license = "MIT"
repository = "https://github.com/DSL-21/Echoes-World-Simulator"

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["2d", "ui"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
